syntax = "proto3";

package inventory.stock;
option csharp_namespace = "InventoryApp.Contracts.Stock";

import "common.proto";

service InventoryService {
  rpc ListMovements (ListMovementsRequest) returns (ListMovementsResponse);
  rpc ReceiveStock (ReceiveStockRequest) returns (StockOperationResponse);
  rpc IssueStock (IssueStockRequest) returns (StockOperationResponse);
  rpc AdjustStock (AdjustStockRequest) returns (StockOperationResponse);
  rpc TransferStock (TransferStockRequest) returns (StockOperationResponse);
  rpc GetProductHistory (ProductHistoryRequest) returns (ListMovementsResponse);
  rpc GetLowStockAlerts (inventory.common.Empty) returns (LowStockAlertResponse);
}

enum MovementType {
  MOVEMENT_TYPE_UNSPECIFIED = 0;
  MOVEMENT_TYPE_STOCK_IN = 1;        // manual receipt
  MOVEMENT_TYPE_STOCK_OUT = 2;       // manual removal / damage / loss
  MOVEMENT_TYPE_ADJUSTMENT = 3;      // stock count correction (absolute)
  MOVEMENT_TYPE_PURCHASE_RECEIPT = 4;// generated when a purchase order is received
  MOVEMENT_TYPE_SALE = 5;            // generated by a sale
  MOVEMENT_TYPE_SALE_RETURN = 6;     // generated when a sale is cancelled
  MOVEMENT_TYPE_TRANSFER = 7;        // location to location, no net change
}

message StockMovementDto {
  int32 id = 1;
  int32 product_id = 2;
  string product_sku = 3;
  string product_name = 4;
  MovementType movement_type = 5;
  int32 quantity = 6;            // signed: +in / -out, 0 for transfers
  int32 previous_quantity = 7;
  int32 new_quantity = 8;
  string reason = 9;
  string reference = 10;
  int32 user_id = 11;
  string user_name = 12;
  string from_location = 13;
  string to_location = 14;
  string created_at_utc = 15;
}

message ListMovementsRequest {
  inventory.common.PageRequest page = 1;
  optional int32 product_id = 2;
  optional int32 category_id = 3;
  optional MovementType movement_type = 4;
  inventory.common.DateRange date_range = 5;
}

message ListMovementsResponse {
  repeated StockMovementDto items = 1;
  inventory.common.PageInfo page_info = 2;
}

message StockOperationResponse {
  int32 product_id = 1;
  int32 new_quantity = 2;
  StockMovementDto movement = 3;
}

message ReceiveStockRequest {
  int32 product_id = 1;
  int32 quantity = 2;      // must be > 0
  string reason = 3;
  string reference = 4;
}

message IssueStockRequest {
  int32 product_id = 1;
  int32 quantity = 2;      // must be > 0, cannot exceed available stock
  string reason = 3;
  string reference = 4;
}

message AdjustStockRequest {
  int32 product_id = 1;
  int32 counted_quantity = 2;  // absolute value after a physical count
  string reason = 3;
  string reference = 4;
}

message TransferStockRequest {
  int32 product_id = 1;
  int32 quantity = 2;
  string to_location = 3;
  string reason = 4;
}

message ProductHistoryRequest {
  int32 product_id = 1;
  inventory.common.PageRequest page = 2;
  inventory.common.DateRange date_range = 3;
}

message LowStockAlert {
  int32 product_id = 1;
  string sku = 2;
  string name = 3;
  int32 current_stock = 4;
  int32 minimum_stock = 5;
  string supplier_name = 6;
  bool out_of_stock = 7;
}

message LowStockAlertResponse {
  repeated LowStockAlert items = 1;
}
