<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Inventory Manager</title>
    <base href="/" />

    <!-- Fluent UI baseline styles. Loaded before app.css so app.css can override safely. -->
    <link rel="stylesheet" href="_content/Microsoft.FluentUI.AspNetCore.Components/css/reboot.css" />
    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <div class="status-bar-safe-area"></div>

    <div id="app">
        <div class="app-boot">
            <div class="app-boot__spinner"></div>
            <p>Starting Inventory Manager...</p>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unexpected error has occurred.
        <a href="" class="reload">Reload</a>
        <span class="dismiss">&times;</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="_content/Microsoft.FluentUI.AspNetCore.Components/js/loading-theme.js" type="text/javascript"></script>
</body>

</html>
